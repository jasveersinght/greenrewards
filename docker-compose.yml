version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: green-rewards-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenrewards
      POSTGRES_PASSWORD: greenrewards_dev
      POSTGRES_DB: greenrewards
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greenrewards']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
